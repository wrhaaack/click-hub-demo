<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click — Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/usuario-barra.css">
<style>
:root{
  /* ── Fondos ────────────────────────────────────────────────────────────────
     Tres capas: el fondo general, las superficies (cards, paneles) y una
     alterna para celdas de fin de semana y filas intercaladas. */
  --bg:#EDEAE5;        /* fondo general y campos de formulario */
  --sur:#FFFFFF;       /* cards, paneles, el calendario */
  --sur2:#F1EDE7;      /* hover y pastillas: se nota tanto sobre blanco como sobre el fondo */
  --sur3:#F8F7F4;      /* superficie alterna, apenas separada del blanco */

  /* ── Bordes ────────────────────────────────────────────────────────────────
     Sólidos y no rgba: un borde con alpha se ve distinto según lo que tenga
     detrás, y acá conviven cards blancas con el fondo general. */
  --bor:#DDD8D0;       /* suave, para separar dentro de una card */
  --bor2:#CEC7BD;      /* visible, para delimitar controles */

  /* ── Textos ────────────────────────────────────────────────────────────── */
  --txt:#3F3A34;       /* principal — 11:1 sobre blanco */
  --mut:#7B736A;       /* secundario — apenas más oscuro que el #7E766D pedido para llegar a 4.7:1 sobre blanco */
  --hin:#9A9288;       /* tenue: etiquetas y datos de apoyo */

  /* ── Color principal ─────────────────────────────────────────────────────
     La rampa va un escalón más oscura que la propuesta (#9A7B5C/#84684E/#725940):
     sobre el #9A7B5C original el texto blanco del botón quedaba en 3.92:1, y a
     13px hace falta 4.5:1. Corridos los tres a la vez se conserva la distancia
     entre reposo, hover y apretado, y el tono sigue siendo el mismo tostado. */
  --tan:#8E7053;       /* botones y acentos — blanco encima: 4.6:1 */
  --tand:#7A6045;      /* hover — 5.9:1 */
  --tana:#665039;      /* activo (mientras se aprieta) — 7.6:1 */
  --tanl:#E7DDCF;      /* fondo suave: día seleccionado, resaltados */
  --tanlt:#6E5742;     /* texto sobre ese fondo suave */

  --r:10px;
  --rs:6px;

  /* ── Menú lateral ──────────────────────────────────────────────────────── */
  --sb:#9C8163;        /* fondo */
  --sbh:#93795C;       /* hover */
  /* El item activo va un punto más oscuro que el #8F775D pedido: así el texto
     blanco llega a 4.6:1 (el mínimo legible para texto chico) y además queda
     una progresión clara fondo -> hover -> activo, que con los dos valores
     originales casi no se distinguía. */
  --sba:#8A7157;       /* item activo */
  --sbt:#FFFFFF;       /* texto principal y del item activo */
  --sbm:#F6F0E7;       /* texto secundario e items en reposo */
  --sbb:#87704F;       /* separadores */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}
.sb{width:220px;min-width:220px;background:var(--sb);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 18px;border-bottom:1px solid var(--sbb)}
.sb-logo img{height:38px;display:block}
.sb-sub{font-size:11px;color:var(--sbm);margin-top:6px;font-family:'DM Mono',monospace}
.sb-nav{padding:14px 10px 0}
.sb-sec{font-size:10px;font-weight:500;color:var(--sbm);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:5px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;color:var(--sbm);font-size:13px;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;margin-bottom:2px}
.nav-btn:hover{background:var(--sbh);color:var(--sbt)}
.nav-btn.on{background:var(--sba);color:var(--sbt);font-weight:500}
.nav-btn.on .nav-ico{opacity:1}
.nav-ico{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-btn.on .nav-ico,.nav-btn:hover .nav-ico{opacity:1}
.sb-div{height:1px;background:var(--sbb);margin:12px 0}
.sb-cli{padding:0 10px;flex:1;overflow-y:auto;padding-bottom:16px}
.sb-cl-item{padding:6px 10px;border-radius:var(--rs);font-size:12px;color:var(--sbm);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
.sb-cl-item:hover{background:var(--sbh);color:var(--sbt)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle{font-size:15px;font-weight:500;font-family:'Syne',sans-serif}
.sel{padding:6px 10px;border:1px solid var(--bor2);border-radius:var(--rs);background:var(--sur);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--txt);outline:none}
.sel:focus{border-color:var(--tan)}
.btn{padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bor2);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--mut);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--sur2);color:var(--txt)}
.btn-p{background:var(--tan);color:#fff;border-color:var(--tan);font-weight:500}
.btn-p:hover{background:var(--tand);border-color:var(--tand)}
.btn-p:active{background:var(--tana);border-color:var(--tana)}
.btn:active{background:var(--bg)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:var(--rs);border:1px solid var(--bor2);background:transparent;font-family:'DM Sans',sans-serif;color:var(--mut);cursor:pointer}
.btn-sm:hover{background:var(--sur2);color:var(--txt)}
.content{padding:22px 24px;flex:1;overflow-y:auto}
.scr{display:none}.scr.on{display:block}
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.sum-c{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:14px 16px}
.sum-l{font-size:10px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.sum-v{font-size:26px;font-weight:300;font-family:'DM Mono',monospace}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.bp{background:#FEF3C7;color:#92400E}.bpr{background:#DBEAFE;color:#1E3A5F}.br{background:#EDE9FE;color:#3730A3}.bd{background:#D1FAE5;color:#064E3B}.bc{background:#F0FDF4;color:#166534}.bpag{background:#D1FAE5;color:#064E3B}.bnp{background:#FEE2E2;color:#991B1B}
.fpill{font-size:10px;padding:1px 7px;border-radius:20px;background:var(--tanl);color:var(--tanlt);white-space:nowrap}
.tasig{font-size:11px;color:var(--mut);background:var(--sur2);padding:1px 7px;border-radius:20px;white-space:nowrap}
.tfecha{font-size:11px;color:var(--hin);font-family:'DM Mono',monospace}
.tlim{font-size:11px;color:#B91C1C;font-family:'DM Mono',monospace}
.add-btn{width:100%;padding:7px;border:1px dashed var(--bor2);border-radius:var(--rs);background:transparent;font-size:12px;color:var(--mut);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:12px}
.add-btn:hover{background:var(--sur2);color:var(--txt)}
.rol-sec{margin-bottom:14px}.rol-sec:last-child{margin-bottom:0}
.rol-lbl{font-size:10px;font-weight:500;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bor)}
.trow:last-child{border-bottom:none}
.trow-main{flex:1;min-width:0}
.trow-desc{font-size:13px;font-weight:500;color:var(--txt)}
.trow-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.trow-nota{font-size:11px;color:var(--mut);margin-top:3px;word-break:break-all}
.trow-acts{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0}
.trow-btns{display:flex;gap:4px;margin-top:3px}
.tbtn{font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--bor2);background:transparent;cursor:pointer;color:var(--mut);font-family:'DM Sans',sans-serif}
.tbtn:hover{background:var(--sur2)}
.tbtn-d{border-color:transparent;color:#B91C1C}
.tbtn-d:hover{background:#FEE2E2}
.e-sel{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.ebtn{font-size:10px;padding:3px 8px;border-radius:20px;cursor:pointer;border:1px solid transparent;font-family:'DM Sans',sans-serif;opacity:.4;background:transparent}
.ebtn:hover{opacity:.75}
.ebtn.on{opacity:1;font-weight:500}
.e-p{background:#FEF3C7!important;color:#92400E!important;border-color:#FDE68A!important}
.e-pr{background:#DBEAFE!important;color:#1E3A5F!important;border-color:#BFDBFE!important}
.e-r{background:#EDE9FE!important;color:#3730A3!important;border-color:#DDD6FE!important}
.e-l{background:#D1FAE5!important;color:#064E3B!important;border-color:#A7F3D0!important}
.e-c{background:#F0FDF4!important;color:#166534!important;border-color:#BBF7D0!important}
.ccard{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .15s}
.ccard:hover{border-color:var(--tan);box-shadow:0 2px 12px rgba(154,123,92,.16)}
.cc-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.cc-nom{font-size:14px;font-weight:500;font-family:'Syne',sans-serif}
.cc-foot{padding:10px 18px;border-top:1px solid var(--bor);font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:space-between}
.cf{display:none;flex-direction:column;flex:1;overflow:hidden;background:var(--bg)}
.cf.on{display:flex}
.cf-hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:13px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.cf-back{font-size:13px;color:var(--mut);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;display:flex;align-items:center;gap:6px}
.cf-back:hover{color:var(--txt)}
.cf-body{flex:1;overflow-y:auto;padding:24px}
.cf-inner{max-width:900px;margin:0 auto}
.cf-tabs{display:flex;border-bottom:1px solid var(--bor);background:var(--sur);border-radius:var(--r) var(--r) 0 0}
.cf-tab{padding:10px 16px;font-size:12px;color:var(--mut);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:-1px}
.cf-tab:hover{color:var(--txt)}
.cf-tab.on{color:var(--tand);border-bottom-color:var(--tan);font-weight:500}
.cf-pan{display:none;background:var(--sur);border:1px solid var(--bor);border-top:none;border-radius:0 0 var(--r) var(--r);padding:20px}
.cf-pan.on{display:block}
.filtros{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{padding:5px 13px;border-radius:20px;border:1px solid var(--bor2);background:var(--sur);font-size:12px;color:var(--mut);cursor:pointer;font-family:'DM Sans',sans-serif}
.fbtn:hover{background:var(--sur2);color:var(--txt)}
.fbtn.on{background:var(--tan);color:#fff;border-color:var(--tan);font-weight:500}
.cal-wrap{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bor)}
.cal-dn{padding:9px;font-size:10px;font-weight:500;color:var(--hin);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:80px;padding:7px;border-right:1px solid var(--bor);border-bottom:1px solid var(--bor)}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.om{background:var(--sur3);opacity:.55}
/* El día de hoy lleva un aro por dentro (box-shadow inset) y no un border:
   un borde de 2px correría el contenido de la celda y se vería el salto
   contra las celdas vecinas, que ya tienen 1px de separación. */
.cal-cell.hoy{background:var(--tanl);box-shadow:inset 0 0 0 2px var(--tan)}
.cal-cell.hoy .cal-num{color:var(--tanlt);font-weight:600}
.cal-num{font-size:11px;color:var(--hin);margin-bottom:4px;font-family:'DM Mono',monospace}
.cal-cell.hoy .cal-num{color:var(--tand);font-weight:500}
.cal-ev{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Las tarjetas del resumen ahora son botones: se abren para mostrar de qué
   tareas hablan. Se les rehace el aspecto porque un <button> trae lo suyo. */
.sum-c{font-family:'DM Sans',sans-serif;text-align:left;cursor:pointer;transition:all .15s;width:100%}
.sum-c:hover{border-color:var(--tan)}
.sum-c.abierta{border-color:var(--tan);box-shadow:0 2px 12px rgba(154,123,92,.18)}
.sum-c.abierta .sum-l{color:var(--tand)}

.sum-detalle{display:none;background:var(--sur);border:1px solid var(--tan);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.sum-detalle.on{display:block}
.sd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sd-tit{font-size:13px;font-weight:500;font-family:'Syne',sans-serif}
.sd-n{font-size:11px;color:var(--mut);font-family:'DM Mono',monospace;font-weight:400}
.sd-fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bor)}
.sd-fila:last-child{border-bottom:none}
.sd-desc{font-size:13px;font-weight:500;flex:1;min-width:120px}
.sd-cli{font-size:11px;color:var(--mut)}
.sd-vacio{font-size:12px;color:var(--hin);padding:14px;text-align:center}

.selector-mes{display:flex;gap:10px;align-items:center}
.ev-E{background:#DBEAFE;color:#1E3A5F}.ev-D{background:#EDE9FE;color:#3730A3}.ev-C{background:#D1FAE5;color:#064E3B}.ev-S{background:#FEF3C7;color:#92400E}
.bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.bs-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px}
.bs-nom{font-size:14px;font-weight:500;font-family:'Syne',sans-serif;margin-bottom:12px}
.idea-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.idea-in{flex:1;padding:6px 10px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--txt);outline:none}
.idea-in:focus{border-color:var(--tan);background:var(--sur)}
.ibtn{width:26px;height:26px;border:none;background:none;cursor:pointer;color:var(--hin);font-size:13px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn.c:hover{background:var(--tanl);color:var(--tand)}
.ibtn.d:hover{background:#FEE2E2;color:#B91C1C}
.inspo-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.in-lbl{width:90px;padding:5px 8px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--txt);outline:none}
.in-url{flex:1;padding:5px 8px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Mono',monospace;font-size:11px;background:var(--bg);color:var(--tand);outline:none}
.in-lbl:focus,.in-url:focus{border-color:var(--tan)}
.add-s{width:100%;padding:6px;border:1px dashed var(--bor2);border-radius:var(--rs);background:transparent;font-size:12px;color:var(--mut);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}
.add-s:hover{background:var(--sur2)}
.bs-sep{height:1px;background:var(--bor);margin:12px 0}
.del-row{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.eq-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.eq-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;font-family:'Syne',sans-serif;flex-shrink:0}
.eq-nom{font-size:14px;font-weight:500;font-family:'Syne',sans-serif}
.hist-ml{font-size:10px;font-weight:500;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bor)}
.hist-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bor)}
.hist-row:last-child{border-bottom:none}
.hist-desc{font-size:13px;text-decoration:line-through;color:var(--mut);flex:1}
.est-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.est-c{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:18px}
.est-c.full{grid-column:1/-1}
.est-t{font-size:14px;font-weight:500;font-family:'Syne',sans-serif;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.est-f{margin-bottom:10px}
.est-l{font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.est-v{font-size:13px;color:var(--txt)}
.est-notes{background:var(--sur2);border-radius:var(--rs);padding:10px 12px;font-size:13px;color:var(--mut);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.est-li{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--bor);margin-bottom:6px}
.est-ll{font-size:12px;font-weight:500;color:var(--txt);min-width:80px}
.est-lu{font-size:12px;color:var(--tand);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.est-lu:hover{text-decoration:underline}
.fe-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.fe-d{padding:5px 8px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--txt);outline:none;width:140px}
.fe-l{flex:1;padding:5px 8px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--txt);outline:none}
.fe-d:focus,.fe-l:focus{border-color:var(--tan)}
.cc-wrap{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rs);overflow:hidden}
.cc-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bor)}
.cc-dn{padding:6px 4px;font-size:9px;font-weight:500;color:var(--hin);text-align:center;text-transform:uppercase;background:var(--sur)}
.cc-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cc-cell{min-height:64px;padding:5px 6px;border-right:1px solid var(--bor);border-bottom:1px solid var(--bor);background:var(--sur)}
.cc-cell:nth-child(7n){border-right:none}
.cc-cell.om{background:var(--sur3);opacity:.55}
.cc-cell.hoy{background:var(--tanl);box-shadow:inset 0 0 0 2px var(--tan)}
.cc-num{font-size:10px;color:var(--hin);margin-bottom:2px;font-family:'DM Mono',monospace}
.cc-cell.hoy .cc-num{color:var(--tand);font-weight:500}
.cc-ev{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-esp{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:1px;background:#FEF3C7;color:#92400E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo{display:none;position:fixed;inset:0;background:rgba(63,58,52,.32);z-index:100;align-items:flex-start;justify-content:center;padding-top:50px}
.mo{display:none;position:fixed;inset:0;background:rgba(63,58,52,.32);z-index:100;align-items:flex-start;justify-content:center;padding-top:50px}
.mo.on{display:flex}
.mo-card{background:var(--sur);border:1px solid var(--bor2);border-radius:var(--r);padding:22px 24px;width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(63,58,52,.12)}
.mo-card h3{font-size:15px;font-weight:500;font-family:'Syne',sans-serif;margin-bottom:16px}
.f{margin-bottom:11px}
.f label{font-size:10px;color:var(--hin);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--bor2);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--txt);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--tan);background:var(--sur)}
.f-nota{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.45}
/* Persona que viene de antes y todavía no tiene usuario enlazado. */
.eq-sinu{background:#FEF3C7;color:#92400E;margin:4px 0 0 5px;display:inline-block}
.f-nota a{color:var(--tand)}
/* El nombre de alguien que ya está en el equipo se muestra, no se edita: es el
   del usuario y se cambia en la pantalla de Usuarios. */
.f-fijo{padding:8px 10px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur2);font-size:13px;color:var(--txt)}
.f textarea{min-height:65px;resize:vertical}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mo-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sec-div{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.sec-div span{font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.sec-div::before,.sec-div::after{content:'';flex:1;height:1px;background:var(--bor2)}
.lr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lr input{flex:1;padding:6px 10px;border:1px solid var(--bor);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;background:var(--bg);color:var(--txt);outline:none}
.lr input:focus{border-color:var(--tan)}
.ldel{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--hin);font-size:13px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.ldel:hover{background:#FEE2E2;color:#B91C1C}
.al-btn{font-size:12px;color:var(--mut);background:none;border:1px dashed var(--bor2);border-radius:var(--rs);padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px}
.al-btn:hover{background:var(--sur2)}
.chk{display:flex;align-items:center;gap:8px;margin-top:4px}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--tan);cursor:pointer}
.chk label{font-size:13px;color:var(--txt);cursor:pointer}
.asig-pills{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg);border:1px solid var(--bor2);border-radius:var(--rs);min-height:40px;margin-top:4px}
.asig-pill{font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1px solid var(--bor2);background:var(--sur2);color:var(--txt);font-family:'DM Sans',sans-serif;transition:all .12s;user-select:none}
.asig-pill.on{background:var(--tan);color:#fff;border-color:var(--tan)}
.roles-li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bor)}
/* ── Agregados de la versión con login ─────────────────────────────────────── */
/* El bloque de usuario va sobre la franja tostada: se le dan vuelta los colores
   (las clases .ck-* viven en /css/usuario-barra.css). */
/* El menú es position:sticky, y eso arma su propio contexto de apilamiento: sin
   un z-index acá, el panel de notificaciones queda por debajo del contenido y se
   ve el tablero a través de él. Va por debajo de los modales, que usan 100. */
.sb{z-index:50}
.sb-user{padding:12px 14px;border-top:1px solid var(--sbb);flex-shrink:0}
.sb .ck-user{--ck-fg:var(--sbm);--ck-fg-fuerte:var(--sbt);--ck-hover:var(--sbh)}
.sb-cli{flex:1 1 auto;min-height:0}
/* Pantalla de carga inicial: mientras llegan los datos del servidor. */
.cargando{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000;font-size:13px;color:var(--mut)}
.cargando.off{display:none}
/* Todo lo que solo puede tocar quien tiene permiso "full" se esconde con esto. */
.rol-lbl.otros{color:#B91C1C}
/* ── Dashboard ─────────────────────────────────────────────────────────────
   Dos columnas: a la izquierda la agenda del mes día por día, a la derecha el
   registro de lo que fue pasando. */
.dash-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.dash-c{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;min-width:0}
.dash-t{font-size:13px;font-weight:500;font-family:'Syne',sans-serif;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.dash-sub{font-size:11px;color:var(--hin);font-weight:400;font-family:'DM Mono',monospace;text-transform:lowercase}

.agenda{max-height:520px;overflow-y:auto;padding-right:4px}
.ag-dia{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bor)}
.ag-dia:last-child{border-bottom:none}
.ag-dia.hoy{background:var(--tanl);border-radius:var(--rs);padding-left:7px;padding-right:7px;box-shadow:inset 0 0 0 2px var(--tan)}
.ag-dia.finde .ag-num{color:var(--hin)}
.ag-fecha{width:46px;flex-shrink:0;text-align:center}
.ag-num{font-size:15px;font-family:'DM Mono',monospace;line-height:1.1}
.ag-dia.hoy .ag-num{color:var(--tanlt);font-weight:600}
.ag-dow{font-size:9px;color:var(--hin);text-transform:uppercase;letter-spacing:.06em}
.ag-items{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
.ag-item{font-size:12px;line-height:1.35;display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
.ag-cli{font-size:10px;color:var(--mut);background:var(--sur2);padding:1px 6px;border-radius:20px;white-space:nowrap}
.ag-vacio{font-size:11px;color:var(--hin)}
.ag-esp{font-size:11px;color:#92400E;background:#FEF3C7;padding:1px 6px;border-radius:20px}

.act-lista{max-height:520px;overflow-y:auto;padding-right:4px}
.act-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--bor)}
.act-item:last-child{border-bottom:none}
.act-punto{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.act-alta{background:#34D399}.act-edicion{background:#60A5FA}.act-baja{background:#F87171}
.act-cuerpo{flex:1;min-width:0}
.act-texto{font-size:12.5px;line-height:1.4;word-break:break-word}
.act-pie{font-size:10px;color:var(--hin);font-family:'DM Mono',monospace;margin-top:2px}
.act-vacio{font-size:12px;color:var(--hin);text-align:center;padding:26px}

@media (max-width:900px){ .dash-cols{grid-template-columns:1fr} }

/* ── Botón de menú y fondo oscuro: solo existen en pantallas chicas ───────── */
.menu-btn{
  display:none;border:none;background:none;cursor:pointer;padding:6px;
  border-radius:var(--rs);color:var(--mut);flex-shrink:0;line-height:0
}
.menu-btn:hover{background:var(--sur2);color:var(--txt)}
.sb-fondo{
  display:none;position:fixed;inset:0;background:rgba(26,23,20,.45);z-index:40
}
.sb-fondo.on{display:block}

/* ════════════════════════════════════════════════════════════════════════════
   DE ACÁ PARA ABAJO: QUE ANDE EN CUALQUIER PANTALLA
   El diseño de escritorio queda exactamente igual; esto solo entra cuando la
   ventana se achica. Tres cortes: notebook chica, tablet y teléfono.
   ════════════════════════════════════════════════════════════════════════════ */

/* ── Hasta 1100px: se aprovecha mejor el ancho ───────────────────────────── */
@media (max-width:1100px){
  .sb{width:190px;min-width:190px}
  .content{padding:18px 16px}
  .topbar{padding:12px 16px}
  .cf-hdr{padding:12px 16px}
  .cf-body{padding:16px}
  .sumbar{grid-template-columns:repeat(2,1fr)}
  .est-wrap{grid-template-columns:1fr}
}

/* ── Hasta 860px: el menú pasa a ser un cajón que entra desde la izquierda ── */
@media (max-width:860px){
  .menu-btn{display:block}

  .sb{
    position:fixed;top:0;left:0;bottom:0;height:100dvh;width:250px;min-width:250px;
    transform:translateX(-100%);transition:transform .22s ease;
    z-index:60;box-shadow:2px 0 18px rgba(63,58,52,.22)
  }
  .sb.abierto{transform:translateX(0)}

  .topbar{flex-wrap:wrap;row-gap:10px}
  /* Los dos botones de alta pasan a ocupar todo el ancho, en su propia fila. */
  .topbar>div:last-child{width:100%;display:flex;gap:8px}
  .topbar>div:last-child .btn{flex:1}

  .cf-hdr{flex-wrap:wrap;row-gap:8px}
  .cf-hdr>div[style*="margin-left:auto"]{margin-left:0!important;width:100%}
  .cf-hdr>div[style*="margin-left:auto"] .btn{flex:1}
  /* La barrita vertical decorativa estorba cuando el encabezado se parte. */
  .cf-hdr>div[style*="width:1px"]{display:none}

  /* El calendario no se puede achicar: 7 columnas necesitan ancho. Se lo deja
     scrollear en horizontal en vez de aplastar las celdas hasta lo ilegible. */
  .cal-wrap,.cc-wrap{overflow-x:auto}
  .cal-head,.cal-grid,.cc-head,.cc-grid{min-width:620px}

  .cf-tabs{overflow-x:auto}
  .cf-tab{white-space:nowrap}

  .mo{align-items:flex-end;padding:0}
  .mo-card{
    width:100%!important;max-width:100%;border-radius:var(--r) var(--r) 0 0;
    max-height:92dvh;padding:20px 18px
  }
}

/* ── Hasta 560px: teléfono ───────────────────────────────────────────────── */
@media (max-width:560px){
  .content{padding:14px 12px}
  .topbar{padding:10px 12px;gap:10px}
  .sumbar{gap:8px;margin-bottom:16px}
  .sum-c{padding:11px 12px}
  .sum-v{font-size:21px}
  .ptitle{font-size:14px}

  /* Cada tarea ocupa el ancho completo: el estado y los botones abajo, no al
     costado, que es lo que hacía que se cortaran. */
  .trow{flex-direction:column;gap:6px}
  .trow-acts{flex-direction:row;align-items:center;width:100%;justify-content:space-between}
  .del-row{gap:6px}
  .del-row>span{min-width:0!important}

  .cf-pan{padding:14px}
  .hist-row{flex-wrap:wrap;gap:6px}
  .sd-fila{gap:6px}
  .sd-desc{flex:1 1 100%}
  .eq-grid{grid-template-columns:1fr}
  .bs-grid{grid-template-columns:1fr}
  .idea-row,.inspo-row,.fe-row{flex-wrap:wrap}
  .in-lbl,.in-url,.fe-d,.fe-l{min-width:0;flex:1 1 140px}
  .lr{flex-wrap:wrap}
  .filtros{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .fbtn{white-space:nowrap}
}

/* ── Hasta 380px: los teléfonos más angostos ─────────────────────────────── */
@media (max-width:380px){
  /* .f-row es una grilla de dos columnas. Hasta acá los pares de campos entran
     bien lado a lado; más angosto que esto, los selectores de fecha se cortan. */
  .f-row{grid-template-columns:1fr;gap:0}
  .topbar{gap:8px}
  .sel{padding:5px 7px;font-size:11px}
}

/* En pantallas táctiles los objetivos chicos son difíciles de acertar. */
@media (pointer:coarse){
  .ebtn,.tbtn,.btn-sm,.ibtn{min-height:30px}
  .nav-btn{padding:11px 10px}
  .sb-cl-item{padding:9px 10px}
}
</style>
</head>

<script src="/js/api.js"></script>
<script>
// ── CONSTANTS & STATE ────────────────────────────────────────────────────────
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const ESTADOS = [
  {k:'pendiente',   l:'Pendiente',   c:'e-p',  b:'bp'},
  {k:'en progreso', l:'En progreso', c:'e-pr', b:'bpr'},
  {k:'revisión',    l:'Revisión',    c:'e-r',  b:'br'},
  {k:'listo',       l:'Listo',       c:'e-l',  b:'bd'},
  {k:'cumplido',    l:'✓ Cumplido',  c:'e-c',  b:'bc'}
];
const BG = ['#DBEAFE','#EDE9FE','#D1FAE5','#FEF3C7','#FCE7F3','#E7DDCF','#FEF9C3'];
const TC = ['#1E3A5F','#3730A3','#064E3B','#92400E','#831843','#6E5742','#713F12'];
const CAL_CLS = ['ev-E','ev-D','ev-C','ev-S','ev-E','ev-D','ev-C'];

// El estado arranca vacío: ahora los datos vienen del servidor (GET /api/estado),
// no de localStorage. Las estructuras son exactamente las mismas de antes, así
// que todo lo que dibuja la pantalla quedó igual; lo único que cambió es de
// dónde salen y a dónde se guardan.
let ROLES = [];        // ['Editor','Diseñadora',...] — el orden define los colores
let clientes = [];
let tareas = [];
let ideas = {};
let equipo = [];
let estudio = {nombre:'',ig:'',email:'',tel:'',wa:'',links:[],notas:''};
let fechasEspeciales = {};
let YO = null;         // usuario logueado: {id, nombre, rol, permisos}
let curScr = 'dashboard';   // es la primera del menú y la que abre por defecto
let curCF = null;
let curCFTab = 'tareas';
let calF = 'todo';
let delF = null;
let editTid = null;
let editCid = null;
let editPid = null;
let tmpCliLinks = [];
let tmpEstLinks = [];
let tmpRoles = [];

// ── PERMISOS ─────────────────────────────────────────────────────────────────
// Espejo de lo que hace el backend (src/middleware/auth.js). Acá solo sirve para
// no mostrar botones que el servidor va a rechazar: la decisión real es del
// servidor, esto es comodidad para el que usa el hub.
function puedo(seccion, nivel) { return puedeSeccion(YO, seccion, nivel || 'limitado'); }
// Hay acciones que no dependen de los permisos por sección sino de ser admin:
// borrar tareas, dar de baja clientes, editar los roles y toda la sección
// Equipo. Ver SOLO_ADMIN en src/middleware/auth.js.
function soyAdmin() { return !!YO && YO.rol === 'admin'; }

// ── DATOS: CARGA Y GUARDADO ──────────────────────────────────────────────────
// Antes había un saveAll() que volcaba todo a localStorage después de cada
// cambio. Ahora cada acción manda su propio pedido a la API y actualiza el
// estado local con lo que respondió el servidor, que es la fuente de verdad.

async function cargarEstado() {
  const data = await ckJson('/api/estado');
  if (!data) return false;
  YO = data.yo;
  ROLES = data.roles || [];
  clientes = data.clientes || [];
  tareas = data.tareas || [];
  ideas = data.ideas || {};
  equipo = data.equipo || [];
  estudio = data.estudio || estudio;
  fechasEspeciales = data.fechasEspeciales || {};
  normalizarTareas();
  return true;
}

// asig tiene que ser siempre un array: lo dan por sentado el render y el modal.
function normalizarTareas() {
  tareas.forEach(function(t) {
    if (!t.asig) t.asig = [];
    else if (!Array.isArray(t.asig)) t.asig = [t.asig];
    if (!t.asigIds) t.asigIds = [];
  });
}

// Mete o reemplaza una tarea en el estado local con la versión del servidor.
function upsertTarea(t) {
  if (!t) return;
  if (!Array.isArray(t.asig)) t.asig = t.asig ? [t.asig] : [];
  if (!Array.isArray(t.asigIds)) t.asigIds = [];
  var i = tareas.findIndex(function(x) { return x.id === t.id; });
  if (i >= 0) tareas[i] = t; else tareas.push(t);
}

// Vuelve a pedirle al servidor todo el estado y redibuja. Se usa después de los
// cambios que tocan varias cosas a la vez (roles, equipo, borrar un cliente).
async function recargarYRender() {
  if (await cargarEstado()) { aplicarPermisos(); renderAll(); }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getMes() { return parseInt(document.getElementById('mesEl').value); }
function getAno() { return parseInt(document.getElementById('añoEl').value); }
function getPrefix() { return getAno() + '-' + String(getMes()+1).padStart(2,'0'); }

function getRolIdx(rol) { var i = ROLES.indexOf(rol); return i >= 0 ? i : 0; }
function getRolBg(rol) { return BG[getRolIdx(rol) % BG.length]; }
function getRolTc(rol) { return TC[getRolIdx(rol) % TC.length]; }
function getRolCalCls(rol) { return CAL_CLS[getRolIdx(rol) % CAL_CLS.length]; }
function getEstado(k) { return ESTADOS.find(function(e){return e.k===k;}) || ESTADOS[0]; }

function asigHtml(asig) {
  if(!asig || !asig.length) return '';
  var arr = Array.isArray(asig) ? asig : [asig];
  return arr.map(function(a){ return '<span class="tasig">'+esc(a)+'</span>'; }).join('');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Tolerantes a que el modal no exista: el de "Mi cuenta" lo dibuja /js/api.js
// recién cuando termina de cargar la sesión.
function closeMo(id) { var el=document.getElementById(id); if(el) el.classList.remove('on'); }
function openMo(id) { var el=document.getElementById(id); if(el) el.classList.add('on'); }

// Quien no puede mover el estado ve solamente el estado en el que está, sin los
// otros botones: no tiene sentido ofrecer un click que el servidor va a negar.
function estadoSel(tid, estado) {
  if(!puedo('tareas','limitado')) {
    var e = getEstado(estado);
    return '<div class="e-sel"><span class="ebtn on '+e.c+'">'+e.l+'</span></div>';
  }
  var h = '<div class="e-sel">';
  ESTADOS.forEach(function(e) {
    h += '<button class="ebtn ' + e.c + (estado===e.k?' on':'') + '" onclick="setEstado(' + tid + ',&quot;' + e.k + '&quot;)">' + e.l + '</button>';
  });
  return h + '</div>';
}

// El cambio se pinta enseguida y recién después se confirma contra el servidor.
// Si el servidor lo rechaza (por permisos, o porque otro la borró), se vuelve
// atrás y se avisa: nunca queda un estado en pantalla que no esté guardado.
async function setEstado(tid, estado) {
  var t = tareas.find(function(x){return x.id===tid;});
  if(!t || t.estado === estado) return;
  var anterior = t.estado;
  t.estado = estado;
  renderAll();
  var actualizada = await ckJson('/api/tareas/'+tid+'/estado', {
    method: 'PATCH', body: JSON.stringify({estado: estado})
  });
  if(!actualizada) { t.estado = anterior; renderAll(); return; }
  upsertTarea(actualizada);
  renderAll();
}

// ── MENÚ EN PANTALLAS CHICAS ─────────────────────────────────────────────────
// Debajo de 860px el menú lateral se convierte en un cajón. Se abre con el botón
// de la barra superior y se cierra al elegir algo, al tocar afuera o con Escape.
function menuEsCajon() { return window.matchMedia('(max-width:860px)').matches; }
function alternarMenu() {
  var abierto = document.getElementById('sbMenu').classList.toggle('abierto');
  document.getElementById('sbFondo').classList.toggle('on', abierto);
}
function cerrarMenu() {
  document.getElementById('sbMenu').classList.remove('abierto');
  document.getElementById('sbFondo').classList.remove('on');
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
// El selector de mes solo aparece donde se lo cambia a mano. En el resto de las
// vistas el mes sigue valiendo (es un estado global), pero se elige desde acá.
var VISTAS_CON_MES = ['clientes', 'calendario'];
function pintarSelectorDeMes(){
  var el = document.getElementById('selectorMes');
  if(el) el.style.display = VISTAS_CON_MES.indexOf(curScr) >= 0 ? '' : 'none';
}

var PAGE = {dashboard:'Dashboard',clientes:'Clientes',calendario:'Calendario',brainstorm:'Brainstorming',delegacion:'Delegación',equipo:'Equipo',estudio:'El estudio'};
function goScr(name, el) {
  if(YO && !puedo(SCR_SECCION[name])) return;  // sección no habilitada para este usuario
  if(menuEsCajon()) cerrarMenu();
  closeCF();
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('scr-'+name).classList.add('on');
  if(el) el.classList.add('on');
  curScr = name;
  document.getElementById('ptitle').textContent = PAGE[name];
  pintarSelectorDeMes();
  if(name==='dashboard') renderDash();
  else if(name==='calendario') renderCal();
  else if(name==='brainstorm') renderBS();
  else if(name==='delegacion') renderDel();
  else if(name==='equipo') renderEq();
  else if(name==='estudio') renderEst();
}
function onFechaChange() {
  document.getElementById('sbSub').textContent = MESES[getMes()].toLowerCase()+' '+getAno();
  renderAll();
  if(curCF) renderCF();
}

// ── FULLSCREEN CLIENTE ────────────────────────────────────────────────────────
function openCF(cid) {
  var c = clientes.find(function(x){return x.id===cid;});
  if(!c) return;
  if(menuEsCajon()) cerrarMenu();
  curCF = cid;
  curCFTab = 'tareas';
  document.getElementById('cfNom').textContent = c.nombre;
  document.getElementById('cfMes2').textContent = MESES[getMes()]+' '+getAno();
  var addBtn = document.getElementById('cfAddBtn');
  addBtn.onclick = function(){ openMoTarea(cid); };
  addBtn.style.display = puedo('tareas','full') ? '' : 'none';
  document.getElementById('cfExpBtn').onclick = function(){ exportar(cid); };
  document.getElementById('cfDiv').classList.add('on');
  document.getElementById('mainContent').style.display = 'none';
  renderCF();
}
function closeCF() {
  curCF = null;
  document.getElementById('cfDiv').classList.remove('on');
  document.getElementById('mainContent').style.display = '';
}
function setCFTab(tab) { curCFTab = tab; renderCF(); }
function renderCF() {
  if(!curCF) return;
  var cid = curCF;
  var c = clientes.find(function(x){return x.id===cid;});
  var prefix = getPrefix();
  var tabs = [{k:'tareas',l:'Tareas'},{k:'calendario',l:'Calendario'},{k:'historial',l:'Historial'},{k:'info',l:'Info'}];
  var tabsH = tabs.map(function(t){
    return '<button class="cf-tab'+(curCFTab===t.k?' on':'')+'" onclick="setCFTab(&quot;'+t.k+'&quot;)">'+t.l+'</button>';
  }).join('');
  document.getElementById('cfInner').innerHTML = '<div class="cf-tabs">'+tabsH+'</div><div class="cf-pan on" id="cfPan"></div>';
  var pan = document.getElementById('cfPan');
  if(!pan) return;

  if(curCFTab==='tareas') {
    var ts = tareas.filter(function(t){return t.cid===cid&&t.fecha&&t.fecha.startsWith(prefix)&&t.estado!=='cumplido';});
    var h = '';
    // Se agrupa por rol, y al final se agrega un grupo con las que quedaron
    // etiquetadas con un rol que ya no existe: sin esto, borrar un rol hacía
    // desaparecer de la pantalla tareas que seguían estando.
    var grupos = ROLES.slice();
    var huerfanas = ts.filter(function(t){ return ROLES.indexOf(t.rol) < 0; });
    if(huerfanas.length) grupos.push(null);
    grupos.forEach(function(rol){
      var rt = rol === null ? huerfanas : ts.filter(function(t){return t.rol===rol;});
      if(!rt.length) return;
      h += '<div class="rol-sec"><div class="rol-lbl'+(rol===null?' otros':'')+'">'+(rol===null?'Sin rol asignado':esc(rol))+'</div>';
      rt.forEach(function(t){
        var conPago = ['Editor','Diseñadora'].indexOf(t.rol) >= 0;
        h += '<div class="trow"><div class="trow-main"><div class="trow-desc">'+esc(t.desc)+'</div>'
          +'<div class="trow-meta">'
          +(t.formato?'<span class="fpill">'+esc(t.formato)+'</span>':'')
          +asigHtml(t.asig)
          +(t.fechaLimite?'<span class="tlim">límite: '+t.fechaLimite.slice(8)+'/'+t.fechaLimite.slice(5,7)+'</span>':'')
          +(t.fecha?'<span class="tfecha">pub: '+t.fecha.slice(8)+'/'+t.fecha.slice(5,7)+'</span>':'')
          +'</div>'
          +(t.notas?'<div class="trow-nota">'+esc(t.notas)+'</div>':'')
          +estadoSel(t.id, t.estado)
          +'</div><div class="trow-acts">'
          +(conPago?'<button onclick="togglePago('+t.id+')" class="badge '+(t.pagado?'bpag':'bnp')+'" style="border:none;cursor:'+(puedo('tareas','limitado')?'pointer':'default')+';font-family:inherit"'+(puedo('tareas','limitado')?'':' disabled')+'>'+(t.pagado?'pagado':'sin pagar')+'</button>':'')
          +((puedo('tareas','full')||soyAdmin())?'<div class="trow-btns">'+(puedo('tareas','full')?'<button class="tbtn" onclick="openMoTarea('+t.id+',true)">Editar</button>':'')+(soyAdmin()?'<button class="tbtn tbtn-d" onclick="delTareaById('+t.id+')">✕</button>':'')+'</div>':'')
          +'</div></div>';
      });
      h += '</div>';
    });
    if(!h) h = '<p style="color:var(--hin);font-size:13px;padding:20px;text-align:center">Sin tareas este mes</p>';
    if(puedo('tareas','full')) h += '<button class="add-btn" onclick="openMoTarea('+cid+')">+ Agregar tarea</button>';
    pan.innerHTML = h;
  } else if(curCFTab==='calendario') {
    pan.innerHTML = renderCliCalHtml(cid);
  } else if(curCFTab==='historial') {
    var cum = tareas.filter(function(t){return t.cid===cid&&t.estado==='cumplido';}).sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
    var byM = {};
    cum.forEach(function(t){var k=t.fecha?t.fecha.slice(0,7):'sf';if(!byM[k])byM[k]=[];byM[k].push(t);});
    var h = '';

// ── RENDER SUMMARY & CLIENTES GRID ───────────────────────────────────────────
// Las cuatro tarjetas del resumen. Cada una se puede abrir para ver de qué
// tareas está hablando; abrir una cierra la anterior, y volver a tocar la misma
// la cierra. El filtro elegido se guarda en sumAbierta.
var TARJETAS = [
  {clave:'todas',       titulo:'Tareas del mes', filtra:function(){ return true; }},
  {clave:'pendiente',   titulo:'Pendientes',     filtra:function(t){ return t.estado==='pendiente'; }},
  {clave:'en progreso', titulo:'En progreso',    filtra:function(t){ return t.estado==='en progreso'; }},
  {clave:'listo',       titulo:'Listos',         filtra:function(t){ return t.estado==='listo'; }},
];
var sumAbierta = null;

function tareasDelMes(){
  var prefix = getPrefix();
  return tareas.filter(function(t){ return t.fecha && t.fecha.startsWith(prefix); });
}

function renderSum() {
  var ts = tareasDelMes();
  document.getElementById('sumbar').innerHTML = TARJETAS.map(function(c){
    var n = ts.filter(c.filtra).length;
    return '<button type="button" class="sum-c'+(sumAbierta===c.clave?' abierta':'')+'" '
      + 'onclick="abrirDetalle(&quot;'+c.clave+'&quot;)" '
      + 'aria-expanded="'+(sumAbierta===c.clave)+'">'
      + '<div class="sum-l">'+c.titulo+'</div><div class="sum-v">'+n+'</div></button>';
  }).join('');
  renderSumDetalle();
}

function abrirDetalle(clave){
  sumAbierta = (sumAbierta === clave) ? null : clave;
  renderSum();
}

function renderSumDetalle(){
  var el = document.getElementById('sumDetalle');
  if(!el) return;
  if(!sumAbierta){ el.innerHTML = ''; el.classList.remove('on'); return; }
  el.classList.add('on');

  var tarjeta = TARJETAS.find(function(c){ return c.clave === sumAbierta; });
  var lista = tareasDelMes().filter(tarjeta.filtra)
    .sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); });

  var cabecera = '<div class="sd-top"><span class="sd-tit">'+tarjeta.titulo
    + ' · ' + MESES[getMes()].toLowerCase() + ' ' + getAno()
    + ' <span class="sd-n">' + lista.length + '</span></span>'
    + '<button class="btn-sm" onclick="abrirDetalle(&quot;'+sumAbierta+'&quot;)">Cerrar ✕</button></div>';

  if(!lista.length){
    el.innerHTML = cabecera + '<div class="sd-vacio">No hay tareas en este estado.</div>';
    return;
  }

  el.innerHTML = cabecera + lista.map(function(t){
    var c = clientes.find(function(x){ return x.id === t.cid; });
    var e = getEstado(t.estado);
    return '<div class="sd-fila">'
      + '<span class="badge '+e.b+'">'+e.l+'</span>'
      + '<span class="sd-desc">'+esc(t.desc)+'</span>'
      + (t.formato ? '<span class="fpill">'+esc(t.formato)+'</span>' : '')
      + (c ? '<span class="sd-cli">'+esc(c.nombre)+'</span>' : '')
      + asigHtml(t.asig)
      + (t.fecha ? '<span class="tfecha">'+t.fecha.slice(8)+'/'+t.fecha.slice(5,7)+'</span>' : '')
      + (puedo('tareas','full') ? '<button class="tbtn" onclick="openMoTarea('+t.id+',true)">Editar</button>' : '')
      + '</div>';
  }).join('');
}
function renderCli() {
  document.getElementById('sbCli').innerHTML=clientes.map(function(c){return '<div class="sb-cl-item" onclick="openCF('+c.id+')">'+esc(c.nombre)+'</div>';}).join('');
  var prefix=getPrefix();
  document.getElementById('cGrid').innerHTML=clientes.map(function(c){
    var ts=tareas.filter(function(t){return t.cid===c.id&&t.fecha&&t.fecha.startsWith(prefix);});
    var bp=ts.filter(function(t){return t.estado==='pendiente';}).length;
    var bpr=ts.filter(function(t){return t.estado==='en progreso';}).length;
    var br=ts.filter(function(t){return t.estado==='revisión';}).length;
    var bd=ts.filter(function(t){return t.estado==='listo';}).length;
    return '<div class="ccard" onclick="openCF('+c.id+')">'
      +'<div class="cc-head"><span class="cc-nom">'+esc(c.nombre)+'</span><span style="display:flex;gap:4px">'
      +(bp?'<span class="badge bp">'+bp+'</span>':'')+(bpr?'<span class="badge bpr">'+bpr+'</span>':'')+(br?'<span class="badge br">'+br+'</span>':'')+(bd?'<span class="badge bd">'+bd+'</span>':'')
      +'</span></div>'
      +'<div class="cc-foot"><span>'+ts.length+' tarea'+(ts.length!==1?'s':'')+' este mes</span>'
      +(puedo('clientes','full')?'<button class="btn-sm" onclick="event.stopPropagation();openMoClienteEdit('+c.id+')">Editar</button>':'')+'</div>'
      +'</div>';
  }).join('');
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
// Dos paneles: la agenda del mes día por día, y el registro de lo que fue
// pasando. Los datos se piden al abrir la vista y al cambiar de mes.
var dashCargando = false;

async function renderDash(){
  var mesEl = document.getElementById('dashMes');
  if(mesEl) mesEl.textContent = MESES[getMes()].toLowerCase()+' '+getAno();
  if(dashCargando) return;
  dashCargando = true;
  try {
    var periodo = getPrefix();
    var agenda = await ckJson('/api/dashboard/agenda?periodo='+periodo);
    var actividad = await ckJson('/api/dashboard/actividad?limite=40');
    if(periodo !== getPrefix()) return;   // cambiaste de mes mientras cargaba
    pintarAgenda(agenda);
    pintarActividad(actividad);
  } finally {
    dashCargando = false;
  }
}

function pintarAgenda(datos){
  var el = document.getElementById('dashAgenda');
  if(!el) return;
  if(!datos){ el.innerHTML='<div class="act-vacio">No se pudo cargar la agenda.</div>'; return; }

  var mes=getMes(), ano=getAno(), prefix=getPrefix();
  var diasDelMes = new Date(ano, mes+1, 0).getDate();
  var hoy = new Date();

  // Se agrupa todo por día antes de dibujar, para recorrer el mes una sola vez.
  var porDia = {};
  function meter(fecha, html){
    if(!fecha) return;
    if(!porDia[fecha]) porDia[fecha]=[];
    porDia[fecha].push(html);
  }
  (datos.especiales||[]).forEach(function(f){
    meter(f.fecha, '<div class="ag-item"><span class="ag-esp">★ '+esc(f.label||'Fecha especial')+'</span><span class="ag-cli">'+esc(f.cliente)+'</span></div>');
  });
  (datos.tareas||[]).forEach(function(t){
    meter(t.fecha, '<div class="ag-item"><span>'+(t.formato?esc(t.formato)+': ':'')+esc(t.descripcion)+'</span><span class="ag-cli">'+esc(t.cliente)+'</span></div>');
  });

  var h='';
  for(var d=1; d<=diasDelMes; d++){
    var iso = prefix+'-'+String(d).padStart(2,'0');
    var fecha = new Date(ano, mes, d);
    var dow = fecha.getDay();
    var esHoy = hoy.getDate()===d && hoy.getMonth()===mes && hoy.getFullYear()===ano;
    var items = porDia[iso] || [];
    h += '<div class="ag-dia'+(esHoy?' hoy':'')+((dow===0||dow===6)?' finde':'')+'">'
      +'<div class="ag-fecha"><div class="ag-num">'+d+'</div><div class="ag-dow">'+DIAS[dow]+'</div></div>'
      +'<div class="ag-items">'+(items.length ? items.join('') : '<span class="ag-vacio">—</span>')+'</div>'
      +'</div>';
  }
  el.innerHTML = h;

  // Se deja el día de hoy a la vista, que es lo que uno viene a mirar.
  var hoyEl = el.querySelector('.ag-dia.hoy');
  if(hoyEl) el.scrollTop = Math.max(0, hoyEl.offsetTop - el.offsetTop - 60);
}

function pintarActividad(lista){
  var el = document.getElementById('dashActividad');
  if(!el) return;
  if(!lista || !lista.length){
    el.innerHTML = '<div class="act-vacio">Todavía no pasó nada por acá.</div>';
    return;
  }
  el.innerHTML = lista.map(function(a){
    return '<div class="act-item">'
      +'<span class="act-punto act-'+esc(a.accion)+'"></span>'
      +'<div class="act-cuerpo"><div class="act-texto">'+esc(a.descripcion)+'</div>'
      +'<div class="act-pie">'+esc(a.fecha)+'</div></div>'
      +'</div>';
  }).join('');
}

function renderCal() {

  var mes=getMes(),ano=getAno(),prefix=getPrefix();

  var h='';
  for(var i=0;i<pd;i++) h+='<div class="cal-cell om"></div>';
  for(var d=1;d<=dm;d++){
    var ds=prefix+'-'+String(d).padStart(2,'0');
    var eh=hoy.getDate()===d&&hoy.getMonth()===mes&&hoy.getFullYear()===ano;

// ── BRAINSTORM ────────────────────────────────────────────────────────────────
function bsKey(cid){return cid+'-'+getPrefix();}
function bsInit(cid){var k=bsKey(cid);if(!ideas[k])ideas[k]={ideas:[],inspo:[]};return ideas[k];}
function genKey(){return 'gen-'+getPrefix();}
function genInit(){var k=genKey();if(!ideas[k])ideas[k]={ideas:[],inspo:[]};return ideas[k];}

function renderBS(){
  var gd=genInit();
  // Con permiso "limitado" el brainstorming se ve pero no se toca: los campos
  // quedan de solo lectura y desaparecen los botones de agregar y borrar.
  var editable=puedo('brainstorm','full');
  var ro=editable?'':' readonly';
  function ideaRows(d, cid, isGen){
    return (d.ideas||[]).map(function(v,i){
      var cidStr=isGen?'&quot;gen&quot;':cid;
      return '<div class="idea-row"><input class="idea-in"'+ro+' value="'+esc(v)+'" onchange="bsUpdateIdea('+cidStr+','+i+',this.value)" placeholder="Idea...">'
        +((!isGen&&puedo('tareas','full'))?'<button class="ibtn c" onclick="ideaToTarea('+cid+','+i+')" title="→ Tarea">→</button>':'')
        +(editable?'<button class="ibtn d" onclick="bsDelIdea('+cidStr+','+i+')">✕</button>':'')+'</div>';
    }).join('');
  }
  function inspoRows(d, cid, isGen){
    var cidStr=isGen?'&quot;gen&quot;':cid;
    return (d.inspo||[]).map(function(l,i){
      return '<div class="inspo-row"><input class="in-lbl"'+ro+' value="'+esc(l.label||'')+'" onchange="bsUpdateInspo('+cidStr+','+i+',&quot;label&quot;,this.value)" placeholder="Etiqueta"><input class="in-url"'+ro+' value="'+esc(l.url||'')+'" onchange="bsUpdateInspo('+cidStr+','+i+',&quot;url&quot;,this.value)" placeholder="https://...">'
        +(l.url?'<a href="'+esc(l.url)+'" target="_blank" style="font-size:16px;color:var(--tand);text-decoration:none">↗</a>':'<span style="width:18px"></span>')
        +(editable?'<button class="ibtn d" onclick="bsDelInspo('+cidStr+','+i+')">✕</button>':'')+'</div>';
    }).join('');
  }
  var genHtml='<div class="bs-card" style="border-color:var(--tan);grid-column:1/-1"><div class="bs-nom">Ideas generales del mes</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    +'<div><div style="font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Ideas</div>'+ideaRows(gd,null,true)+(editable?'<button class="add-s" onclick="bsAddIdea(&quot;gen&quot;)">+ Agregar idea</button>':'')+'</div>'
    +'<div><div style="font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Links de inspo</div>'+inspoRows(gd,null,true)+(editable?'<button class="add-s" onclick="bsAddInspo(&quot;gen&quot;)">+ Agregar link</button>':'')+'</div>'
    +'</div></div>';
  var cliHtml=clientes.map(function(c){
    var d=bsInit(c.id);
    return '<div class="bs-card"><div class="bs-nom">'+esc(c.nombre)+'</div>'
      +'<div style="font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Ideas</div>'
      +ideaRows(d,c.id,false)+(editable?'<button class="add-s" onclick="bsAddIdea('+c.id+')">+ Agregar idea</button>':'')
      +'<div class="bs-sep"></div>'
      +'<div style="font-size:10px;color:var(--hin);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Links de inspo</div>'
      +inspoRows(d,c.id,false)+(editable?'<button class="add-s" onclick="bsAddInspo('+c.id+')">+ Agregar link</button>':'')
      +'</div>';
  }).join('');
  document.getElementById('bsGrid').innerHTML=genHtml+cliHtml;
}
function bsGet(cid){return cid==='gen'?genInit():bsInit(cid);}
// El bloque de ideas se guarda entero y con un respiro de medio segundo: si no,
// escribir una idea larga dispararía un pedido por cada tecla.
var bsTimers = {};
function guardarBS(cid){
  var d = bsGet(cid), periodo = getPrefix(), clave = cid + '-' + periodo;
  clearTimeout(bsTimers[clave]);
  bsTimers[clave] = setTimeout(function(){
    ckJson('/api/brainstorm', {method:'PUT', body: JSON.stringify({
      cliente: cid === 'gen' ? 'gen' : cid, periodo: periodo, ideas: d.ideas, inspo: d.inspo
    })});
  }, 500);
}
function bsAddIdea(cid){var d=bsGet(cid);d.ideas.push('');guardarBS(cid);renderBS();setTimeout(function(){var el=document.getElementById('bsGrid');var ins=el?el.querySelectorAll('.idea-in'):[];if(ins.length)ins[ins.length-1].focus();},50);}
function bsUpdateIdea(cid,i,v){bsGet(cid).ideas[i]=v;guardarBS(cid);}
function bsDelIdea(cid,i){bsGet(cid).ideas.splice(i,1);guardarBS(cid);renderBS();}
function bsAddInspo(cid){var d=bsGet(cid);d.inspo.push({label:'',url:''});guardarBS(cid);renderBS();}
function bsUpdateInspo(cid,i,f,v){bsGet(cid).inspo[i][f]=v;guardarBS(cid);}
function bsDelInspo(cid,i){bsGet(cid).inspo.splice(i,1);guardarBS(cid);renderBS();}
function ideaToTarea(cid,i){var d=bsInit(cid);var desc=d.ideas[i];if(!desc||!desc.trim())return;openMoTarea(cid);document.getElementById('mtDesc').value=desc;}

function renderDelFiltros(){

}

  renderDelFiltros();

  if(!ts.length){document.getElementById('delTable').innerHTML='<p style="color:var(--hin);font-size:13px;padding:24px;text-align:center">Sin tareas este mes</p>';return;}
  var bc={};ROLES.forEach(function(r,i){bc[r]=['bpr','br','bd','bp','bc'][i%5];});

      +'<span style="font-size:12px;color:var(--mut)">'+(c?esc(c.nombre):'')+'</span>'

      +(t.fechaLimite?'<span class="tlim">↯ '+esc(t.fechaLimite)+'</span>':'')
      +(t.fecha?'<span class="tfecha">'+esc(t.fecha)+'</span>':'')
      +estadoSel(t.id,t.estado)
      +(puedo('tareas','full')?'<button class="tbtn" onclick="openMoTarea('+t.id+',true)">Editar</button>':'')
      +'</div>';

function feKey(cid){return 'fe-'+cid+'-'+getPrefix();}
// Igual que el brainstorm: se manda la lista completa del cliente+mes, con un
// respiro para no disparar un pedido por cada tecla mientras se escribe.
var feTimers = {};
function guardarFe(cid){
  var periodo=getPrefix(), k='fe-'+cid+'-'+periodo, items=fechasEspeciales[k]||[];
  clearTimeout(feTimers[k]);
  feTimers[k]=setTimeout(function(){
    ckJson('/api/fechas',{method:'PUT',body:JSON.stringify({cliente:cid,periodo:periodo,items:items})});
  },500);
}
function addFe(cid){var k=feKey(cid);if(!fechasEspeciales[k])fechasEspeciales[k]=[];fechasEspeciales[k].push({fecha:'',label:''});guardarFe(cid);renderCF();}
function updateFe(cid,i,field,val){var k=feKey(cid);if(fechasEspeciales[k]){fechasEspeciales[k][i][field]=val;guardarFe(cid);}}
function delFe(cid,i){var k=feKey(cid);if(fechasEspeciales[k]){fechasEspeciales[k].splice(i,1);guardarFe(cid);renderCF();}}

async function openMoPersona(id) {

async function savePersona() {
  var rol = document.getElementById('mpRol').value || ROLES[0] || '';
  var guardada;
  if(editPid) {
    // El nombre lo manda el usuario enlazado, así que acá solo va el rol. La
    // excepción es una persona vieja sin usuario: ahí además se enlaza.
    var cuerpo = {rol:rol};
    var actual = equipo.find(function(x){ return x.id===editPid; });
    if(actual && !actual.usuario_id) {
      var elegido = document.getElementById('mpUsuario').value;
      if(!elegido) { avisar('Elegí con qué usuario enlazarla'); return; }
      cuerpo.usuario_id = elegido;
    }
    guardada = await ckJson('/api/equipo/'+editPid, {method:'PUT', body: JSON.stringify(cuerpo)});
  } else {
    var uid = document.getElementById('mpUsuario').value;
    if(!uid) { avisar('Elegí a quién sumar'); return; }
    guardada = await ckJson('/api/equipo', {method:'POST', body: JSON.stringify({usuario_id:uid, rol:rol})});
  }
  if(!guardada) return;
  if(editPid) { var i=equipo.findIndex(function(x){return x.id===editPid;}); if(i>=0) equipo[i]=guardada; }
  else { equipo.push(guardada); }
  closeMo('moPersona');
  // Cambiarle el rol a alguien cambia el color de su pastilla donde figure
  // asignada, así que conviene volver a traer el estado en vez de parchearlo.
  if(editPid) { recargarYRender(); } else { renderEq(); }
}

function exportar(cid) {
  var c=clientes.find(function(x){return x.id===cid;}); if(!c) return;
  var mes=getMes(),ano=getAno(),prefix=getPrefix(),mesLbl=MESES[mes]+' '+ano;
  var ts=tareas.filter(function(t){return t.cid===cid&&t.fecha&&t.fecha.startsWith(prefix)&&t.estado!=='cumplido';});
  var feK='fe-'+cid+'-'+prefix,fes=(fechasEspeciales[feK]||[]).filter(function(f){return f.fecha&&f.label;});
  var bsD=(ideas[bsKey(cid)]||{ideas:[],inspo:[]});
  var bsI=(bsD.ideas||[]).filter(function(i){return i.trim();});
  var bsL=(bsD.inspo||[]).filter(function(i){return i.url;});
  var pd=new Date(ano,mes,1).getDay(),dm=new Date(ano,mes+1,0).getDate();
  var fmtC={'Story':{bg:'#DBEAFE',tc:'#1E3A5F'},'Reel':{bg:'#EDE9FE',tc:'#3730A3'},'Post':{bg:'#D1FAE5',tc:'#064E3B'},'Carrusel':{bg:'#FEF3C7',tc:'#92400E'},'Video Story':{bg:'#FCE7F3',tc:'#831843'}};
  var byD={};ts.forEach(function(t){if(!byD[t.fecha])byD[t.fecha]=[];byD[t.fecha].push(t);});
  var feD={};fes.forEach(function(f){if(!feD[f.fecha])feD[f.fecha]=[];feD[f.fecha].push(f);});
  var cells='';
  for(var i=0;i<pd;i++) cells+='<div style="min-height:110px;padding:8px;background:#F8F7F4;border-radius:8px;border:1px solid #DDD8D0;opacity:.3"></div>';
  for(var d=1;d<=dm;d++){
    var ds=prefix+'-'+String(d).padStart(2,'0');
    var dt=byD[ds]||[],df=feD[ds]||[];
    var dow=new Date(ano,mes,d).getDay(),isWE=dow===0||dow===6;
    var items='';
    df.forEach(function(f){items+='<div style="background:#FEF3C7;border-radius:5px;padding:3px 7px;margin-bottom:3px;font-size:10px;color:#92400E;font-weight:500">★ '+esc(f.label)+'</div>';});
    dt.forEach(function(t){var fc=t.formato&&fmtC[t.formato]?fmtC[t.formato]:{bg:'#E7DDCF',tc:'#6E5742'};items+='<div style="border-radius:5px;padding:5px 7px;margin-bottom:3px;background:'+fc.bg+'">'+(t.formato?'<div style="font-size:9px;color:'+fc.tc+';font-weight:600;text-transform:uppercase;margin-bottom:2px">'+esc(t.formato)+'</div>':'')+'<div style="font-size:11px;color:#3F3A34;font-weight:500;line-height:1.3">'+esc(t.desc)+'</div>'+(t.notas?'<div style="font-size:10px;color:#3F3A34;margin-top:3px;line-height:1.4;white-space:pre-wrap">'+esc(t.notas)+'</div>':'')+(t.fecha?'<div style="font-size:9px;color:'+fc.tc+';margin-top:2px;opacity:.8">Pub: '+t.fecha.slice(8)+'/'+t.fecha.slice(5,7)+'</div>':'')+'</div>';});
    cells+='<div style="min-height:110px;padding:8px;background:'+(isWE?'#F8F7F4':'#fff')+';border-radius:8px;border:1px solid '+(isWE?'#CEC7BD':'#DDD8D0')+'"><div style="font-size:12px;font-weight:600;color:'+(dt.length||df.length?'#7A6045':'#9A9288')+';margin-bottom:5px;font-family:Syne,sans-serif">'+d+'</div>'+items+'</div>';
  }
  var lgnd=Object.entries(fmtC).map(function(e){return '<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:'+e[1].bg+'"></div><span style="font-size:11px;color:#7B736A">'+e[0]+'</span></div>';}).join('');
  var bsHtml='';
  if(bsI.length||bsL.length){bsHtml='<div style="margin-top:40px;padding-top:28px;border-top:2px solid #DDD8D0"><div style="font-size:13px;font-weight:600;color:#7A6045;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px">💡 Ideas del mes</div>'+(bsI.length?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px">'+bsI.map(function(i){return '<div style="background:#EDEAE5;border-radius:8px;padding:10px 14px;font-size:13px;color:#3F3A34;display:flex;gap:8px"><span style="color:#7A6045">→</span>'+esc(i)+'</div>';}).join('')+'</div>':'')+(bsL.length?'<div style="display:flex;flex-wrap:wrap;gap:8px">'+bsL.map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" style="background:#DDD8D0;border-radius:8px;padding:8px 14px;font-size:12px;color:#7A6045;text-decoration:none">'+(l.label?esc(l.label):esc(l.url))+' ↗</a>';}).join('')+'</div>':'')+'</div>';}
  // El logo va incrustado en el archivo exportado (no como link a /img), para
  // que el HTML que le mandás al cliente se vea igual aunque no tenga internet
  // ni acceso al servidor. Se lee del mismo <img> del menú, así hay una sola copia.
  var logoSrc=document.getElementById('sbLogo').src;
  var exp='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(c.nombre)+' · '+esc(mesLbl)+'</title><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:#EDEAE5;color:#3F3A34}.page{max-width:900px;margin:0 auto;padding:36px 24px 60px}</style></head><body><div class="page">'
    +'<div style="background:#9C8163;border-radius:16px;padding:26px 32px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between"><img src="'+logoSrc+'" style="height:34px"><div style="text-align:right"><div style="font-size:22px;font-weight:700;font-family:Syne,sans-serif;color:#fff">'+esc(c.nombre)+'</div><div style="font-size:14px;color:rgba(255,255,255,.75);margin-top:3px">Planificación · '+esc(mesLbl)+'</div></div></div>'
    +'<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:center"><span style="font-size:11px;color:#9A9288;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Formatos:</span>'+lgnd+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">'+['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(function(d){return '<div style="text-align:center;font-size:10px;font-weight:500;color:#9A9288;padding:6px 0;text-transform:uppercase">'+d+'</div>';}).join('')+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'+cells+'</div>'
    +bsHtml
    +'<div style="margin-top:36px;padding-top:20px;border-top:1px solid #DDD8D0;display:flex;align-items:center;justify-content:space-between"><img src="'+logoSrc+'" style="height:20px;opacity:.35"><div style="font-size:11px;color:#9A9288">Generado por Click · '+esc(mesLbl)+'</div></div>'
    +'</div></body></html>';
  var blob=new Blob([exp],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=c.nombre.replace(/\s+/g,'-')+'_'+mesLbl.replace(/\s+/g,'-')+'.html';
  a.click();URL.revokeObjectURL(url);
}

// ── RENDER ALL ────────────────────────────────────────────────────────────────
function renderAll() {
  renderSum();
  renderCli();
  if(curScr==='dashboard') renderDash();
  else if(curScr==='calendario') renderCal();
  else if(curScr==='brainstorm') renderBS();
  else if(curScr==='delegacion') renderDel();
  else if(curScr==='equipo') renderEq();
  else if(curScr==='estudio') renderEst();
  if(curCF) renderCF();
}

document.addEventListener('keydown', function(e) {
  if(e.key==='Escape') {
    ['moTarea','moCliente','moPersona','moRoles','moEstudio','cuentaModal'].forEach(function(id){closeMo(id);});
    cerrarMenu();
  }
});

// ── PERMISOS EN PANTALLA ─────────────────────────────────────────────────────
// El servidor ya bloquea lo que no corresponde (src/middleware/auth.js). Esto es
// para que el hub no muestre botones que van a terminar en un "no tenés acceso".
var SCR_SECCION = {dashboard:'dashboard',clientes:'clientes',calendario:'calendario',brainstorm:'brainstorm',delegacion:'delegacion',equipo:'equipo',estudio:'estudio'};

function aplicarPermisos() {
  var primeraVisible = null;
  document.querySelectorAll('.nav-btn[data-scr]').forEach(function(btn){
    var visible = puedo(SCR_SECCION[btn.dataset.scr]);
    btn.style.display = visible ? '' : 'none';
    if(visible && !primeraVisible) primeraVisible = btn.dataset.scr;
  });
  function mostrar(id, visible) {
    var el = document.getElementById(id);
    if(el) el.style.display = visible ? '' : 'none';
  }
  mostrar('btnNuevoCliente', puedo('clientes','full'));
  mostrar('btnNuevaTarea', puedo('tareas','full'));
  // Toda la sección Equipo es admin-only: el botón del menú se esconde solo
  // (el servidor le devuelve 'sin_acceso' a cualquiera que no sea admin), y acá
  // se esconden los controles de adentro.
  mostrar('btnAgregarPersona', soyAdmin());
  // Editar roles es admin-only por la misma razón de fondo: los roles llevan los
  // permisos, y dejarlo abierto sería dejar que alguien se suba los suyos.
  mostrar('btnEditarRoles', soyAdmin());
  document.getElementById('sbCli').parentElement.style.display = puedo('clientes') ? '' : 'none';

  if(!primeraVisible) {
    document.getElementById('mainContent').innerHTML =
      '<p style="color:var(--mut);font-size:13px;padding:40px;text-align:center">'
      + 'Tu usuario todavía no tiene ninguna sección habilitada.<br>Pedile a un administrador que te dé permisos.</p>';
    return;
  }
  // Si la vista que estaba abierta dejó de estar permitida, se pasa a la primera que sí.
  if(!puedo(SCR_SECCION[curScr])) {
    goScr(primeraVisible, document.querySelector('.nav-btn[data-scr="'+primeraVisible+'"]'));
  }
}

// ── ARRANQUE ─────────────────────────────────────────────────────────────────
(async function init(){
  initCalHead();

  // El hub abre en el mes actual. Antes venía fijo en mayo 2026 porque los datos
  // de ejemplo eran de ese mes; ahora los datos son reales y lo natural es
  // entrar viendo el mes en el que estás parado.
  var hoy = new Date();
  var mesEl = document.getElementById('mesEl'), anoEl = document.getElementById('añoEl');
  mesEl.value = String(hoy.getMonth());
  if(Array.prototype.some.call(anoEl.options, function(o){ return o.value === String(hoy.getFullYear()); })) {
    anoEl.value = String(hoy.getFullYear());
  }
  document.getElementById('sbSub').textContent = MESES[getMes()].toLowerCase()+' '+getAno();
  document.getElementById('ptitle').textContent = PAGE[curScr];
  pintarSelectorDeMes();

  if(!(await cargarEstado())) {
    // Sin sesión ckFetch ya redirigió al login. Si llegó acá es que el servidor
    // falló: se saca el "Cargando…" y se ofrece reintentar, en vez de dejar la
    // pantalla trabada en el cartel para siempre.
    document.getElementById('cargando').innerHTML =
      '<div style="text-align:center">No se pudieron cargar los datos.<br>'
      + '<button class="btn" style="margin-top:10px" onclick="location.reload()">Reintentar</button></div>';
    return;
  }
  await montarBarraUsuario('barraUsuario');
  aplicarPermisos();

  // Las notificaciones linkean con un #seccion (por ejemplo /hub.html#delegacion),
  // así que al entrar desde una se abre directo la vista que corresponde.
  var destino = (location.hash || '').replace('#','');
  if(SCR_SECCION[destino] && puedo(SCR_SECCION[destino])) {
    goScr(destino, document.querySelector('.nav-btn[data-scr="'+destino+'"]'));
  }

  renderAll();
  renderBS();
  renderEq();
  renderEst();
  document.getElementById('cargando').classList.add('off');
})();
</script>
